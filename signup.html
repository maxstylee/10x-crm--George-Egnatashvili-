<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-text">10X CRM</div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Fill in your details to get started</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="company" class="form-control" placeholder="Tech Corp LLC" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper" id="passwordWrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <small id="passwordError" class="error-text"></small>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal" id="appAlertModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title" id="alertModalTitle">Notification</h3>
                <button type="button" class="modal-close-btn" onclick="closeAlertModal()">✖</button>
            </div>
            <p class="modal-message" id="alertModalMessage"></p>
            <div class="modal-actions">
                <button type="button" class="btn-primary btn-auto-width" onclick="closeAlertModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
