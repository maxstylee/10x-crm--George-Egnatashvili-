<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="logo-text">10X CRM</div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                    <a href="clients.html" class="nav-link">👥 Clients</a>
                    <a href="profile.html" class="nav-link">👤 Profile</a>
                </nav>
            </div>
            <div class="sidebar-clock">
                <span class="clock-label">⏰ Live Time</span>
                <span id="sidebarClock" class="clock-time">00:00:00</span>
            </div>
            <div class="sidebar-bottom">
                <div>
                    <a href="settings.html" class="settings-btn active">⚙️ Settings</a>
                </div>
                <div>
                    <a href="index.html" class="logout-btn" onclick="logout()">🚪 Logout</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Settings</h2>
            </div>

            <div class="Setting-page">
                <div class="stat-card theme-card flex-group toggle-theme">
                    <h3 class="section-title">Theme Settings</h3>
                    <div class="form-group compact-form toggle-theme-control">
                        <label>Site Theme</label>
                        <select class="form-control" id="themeSelect" onchange="changeTheme(this.value)">
                            <option value="dark">Dark Mode</option>
                            <option value="light">Light Mode</option>
                        </select>
                    </div>
                </div>

                <div class="stat-card">
                    <h3 class="section-title">Change Password</h3>
                    <form id="changePasswordForm" onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" id="currentPassword" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="newPassword" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" id="confirmNewPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn-primary">Update Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/settings.js"></script>

</body>

</html>
