<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <a href="dashboard.html" class="logo-text">10X CRM</a>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link active">📊 Dashboard</a>
                    <a href="clients.html" class="nav-link">👥 Clients</a>
                    <a href="profile.html" class="nav-link">👤 Profile</a>
                </nav>
            </div>
            <div class="sidebar-clock">
                <span class="clock-label">⏰ Live Time</span>
                <span id="sidebarClock" class="clock-time">00:00:00</span>
            </div>
            <div class="sidebar-bottom">
                <div class="sidebar-theme-wrapper">
                    <div class="theme-switch-container">
                        <span class="theme-switch-label" id="sidebarThemeLabel">🌙 Theme</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="sidebarThemeToggle" onchange="toggleThemeSlider(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div>
                    <a href="index.html" class="logout-btn" onclick="logout()">🚪 Logout</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Dashboard</h2>
                <div id="current-time" class="clock-display">00:00:00</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Clients</div>
                    <div id="total-clients" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Active Clients</div>
                    <div id="total-activeClients" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Won Revenue</div>
                    <div id="total-netRevenue" class="stat-value">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">New This Week</div>
                    <div id="total-newThisWeek" class="stat-value">0</div>
                </div>
            </div>

            <h3 class="section-title">Pipeline Overview</h3>
            <div class="pipeline-grid">
                <div class="pipeline-card border-lead" onclick="filterClients('lead')">
                    <p class="stat-title">Lead</p>
                    <p class="stat-value" id="count-lead">0</p>
                </div>
                <div class="pipeline-card border-contacted" onclick="filterClients('contacted')">
                    <p class="stat-title">Contacted</p>
                    <p class="stat-value" id="count-contacted">0</p>
                </div>
                <div class="pipeline-card border-won" onclick="filterClients('won')">
                    <p class="stat-title">Won</p>
                    <p class="stat-value" id="count-won">0</p>
                </div>
                <div class="pipeline-card border-lost" onclick="filterClients('lost')">
                    <p class="stat-title">Lost</p>
                    <p class="stat-value" id="count-lost">0</p>
                </div>
            </div>

            <h3 class="section-title">Recent Clients</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Deal Value</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recent-clients">
                    </tbody>
                </table>
            </div>
            <div class="see-more-container">
                <a href="clients.html" class="see-more-link">See more &gt;</a>
            </div>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
