<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/check-auth.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="logo-text">10X CRM</div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                    <a href="clients.html" class="nav-link">👥 Clients</a>
                    <a href="profile.html" class="nav-link active">👤 Profile</a>
                </nav>
            </div>
             <div class="sidebar-bottom">
                <div>
                    <a href="settings.html" class="settings-btn">⚙️ Settings</a>
                </div>
                <div>
                    <a href="index.html" class="logout-btn" onclick="logout()">🚪 Logout</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Profile Settings</h2>
            </div>

            <div class="profile-grid">
                <div class="stat-card profile-info">
                    <h3 class="section-title">Account Information</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" value="David Smith" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" value="david@company.com" readonly>
                    </div>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" class="form-control" value="10X Digital" readonly>
                    </div>
                    <div class="form-group">
                        <label>Created At</label>
                        <input type="text" class="form-control" value="2026-01-15" readonly>
                    </div>
                </div>

                
            </div>
        </main>
    </div>
    <script src="js/storage.js"></script>
</body>

</html>
