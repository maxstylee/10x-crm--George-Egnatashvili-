<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-text">10X CRM</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Please sign in to your account</p>
            </div>
            <form id="form-signin">
                <div class="form-group">
                    <label>Email Address</label>
                    <input id="signinEmail" type="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="signinPassword" type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal" id="appAlertModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title" id="alertModalTitle">Notification</h3>
                <button type="button" class="modal-close-btn" onclick="closeAlertModal()">✖</button>
            </div>
            <p class="modal-message" id="alertModalMessage"></p>
            <div class="modal-actions">
                <button type="button" class="btn-primary btn-auto-width" onclick="closeAlertModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
