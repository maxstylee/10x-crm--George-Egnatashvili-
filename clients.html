<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Clients</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
    <script src="js/storage.js"></script>
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="logo-text">10X CRM</div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                    <a href="clients.html" class="nav-link active">👥 Clients</a>
                    <a href="profile.html" class="nav-link">👤 Profile</a>
                </nav>
            </div>
            <div class="sidebar-clock">
                <span class="clock-label">⏰ Live Time</span>
                <span id="sidebarClock" class="clock-time">00:00:00</span>
            </div>
            <div class="sidebar-bottom">
                <div>
                    <a href="settings.html" class="settings-btn">⚙️ Settings</a>
                </div>
                <div>
                    <a href="index.html" class="logout-btn" onclick="logout()">🚪 Logout</a>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">

            <!-- Page Header -->
            <div class="page-header">
                <h2>Clients</h2>
                <button class="btn-primary btn-auto-width" onclick="openAddClientModal()">+ Add Client</button>
            </div>

            <!-- Toolbar: Search + Filter Chips + Sort -->
            <div class="clients-toolbar">
                <div class="toolbar-left">

                    <!-- Search -->
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Search...">
                    </div>

                    <!-- Filter Chips -->
                    <div class="filter-chips">
                        <button class="chip chip-active">All</button>
                        <button class="chip">Lead</button>
                        <button class="chip">Contacted</button>
                        <button class="chip">Won</button>
                        <button class="chip">Lost</button>
                    </div>


                </div>

                <!-- Sort -->
                <select class="form-control sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name_asc">Name A–Z</option>
                    <option value="deal_desc">Deal ↓</option>
                </select>
            </div>

            <!-- Clients Zone — JS fills this -->
            <div id="clientsZone"></div>

        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="addClientModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title">Add New Client</h3>
                <button type="button" class="modal-close-btn" onclick="closeAddClientModal()">✖</button>
            </div>
            <form id="addClientForm" onsubmit="handleAddClient(event)">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="newFirstName" class="form-control" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="newLastName" class="form-control" required placeholder="Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newEmail" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="newPhone" class="form-control" required placeholder="+1 234 567 890">
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="newCompany" class="form-control" required placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label>Deal Value ($)</label>
                    <input type="number" id="newDealValue" class="form-control" required placeholder="1500">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="newStatus" class="form-control">
                        <option value="lead">Lead</option>
                        <option value="contacted">Contacted</option>
                        <option value="won">Won</option>
                        <option value="lost">Lost</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Add Client</button>
            </form>
        </div>
    </div>

    <!-- Modal info for client details -->
    <div class="modal" id="clientInfoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title" id="modal-name">Client Info</h3>
                <button class="modal-close-btn" onclick="closeClientModal()">✖</button>
            </div>
            <div class="client-details">
                <div class="detail-row highlight-row">
                    <span class="detail-label">📞 Phone:</span>
                    <span class="detail-value phone-highlight" id="modal-phone"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">📧 Email:</span>
                    <span class="detail-value" id="modal-email"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🏢 Company:</span>
                    <span class="detail-value" id="modal-company"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">💰 Deal Value:</span>
                    <span class="detail-value" id="modal-deal"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">📌 Status:</span>
                    <select id="modal-status" class="form-control status-select"
                        onchange="changeModalClientStatus(this.value)">
                        <option class="badge-lead" value="lead">lead</option>
                        <option class="badge-contacted" value="contacted">contacted</option>
                        <option class="badge-won" value="won">won</option>
                        <option class="badge-lost" value="lost">lost</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="js/clients.js"></script>
</body>

</html>
