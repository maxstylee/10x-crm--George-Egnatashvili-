<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Clients</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
    <script src="js/storage.js"></script>
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <a href="dashboard.html" class="logo-text">10X CRM</a>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                    <a href="clients.html" class="nav-link active">👥 Clients</a>
                    <a href="profile.html" class="nav-link">👤 Profile</a>
                </nav>
            </div>
            <div class="sidebar-clock">
                <span class="clock-label">⏰ Live Time</span>
                <span id="sidebarClock" class="clock-time">00:00:00</span>
            </div>
            <div class="sidebar-bottom">
                <div class="sidebar-theme-wrapper">
                    <div class="theme-switch-container">
                        <span class="theme-switch-label" id="sidebarThemeLabel">🌙 Theme</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="sidebarThemeToggle" onchange="toggleThemeSlider(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div>
                    <a href="index.html" class="logout-btn" onclick="logout()">🚪 Logout</a>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">

            <!-- Page Header -->
            <div class="page-header">
                <h2>Clients</h2>
                <button class="btn-primary btn-auto-width" onclick="openAddClientModal()">+ Add Client</button>
            </div>

            <!-- Toolbar: Search + Filter Chips + Sort -->
            <div class="clients-toolbar">
                <div class="toolbar-left">

                    <!-- Search -->
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Search...">
                    </div>

                    <!-- Filter Chips -->
                    <div class="filter-chips">
                        <button name="all" class="chip chip-active">All</button>
                        <button name="lead" class="chip">Lead</button>
                        <button name="contacted" class="chip">Contacted</button>
                        <button name="won" class="chip">Won</button>
                        <button name="lost" class="chip">Lost</button>
                    </div>

                </div>

                <!-- Sort -->
                <select class="form-control sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name_asc">Name A–Z</option>
                    <option value="deal_desc">Deal ↓</option>
                </select>
            </div>

            <!-- Clients Zone — JS fills this -->
            <div id="clientsZone"></div>

        </main>
    </div>

    <!-- Modal for adding new client -->
    <div class="modal" id="addClientModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title">Add New Client</h3>
                <button type="button" class="modal-close-btn" onclick="closeAddClientModal()">✖</button>
            </div>
            <form id="addClientForm" onsubmit="handleAddClient(event)">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="newFirstName" class="form-control" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="newLastName" class="form-control" required placeholder="Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newEmail" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="newPhone" class="form-control" required placeholder="+1 234 567 890">
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="newCompany" class="form-control" required placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label>Deal Value ($)</label>
                    <input type="number" id="newDealValue" class="form-control" required placeholder="1500">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="newStatus" class="form-control">
                        <option value="lead">Lead</option>
                        <option value="contacted">Contacted</option>
                        <option value="won">Won</option>
                        <option value="lost">Lost</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Add Client</button>
            </form>
        </div>
    </div>

    <!-- Modal for editing client details on double-click -->
    <div class="modal" id="clientInfoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title">Edit Client Details</h3>
                <button type="button" class="modal-close-btn" onclick="closeClientModal()">✖</button>
            </div>
            <form id="editClientForm" onsubmit="saveClientEdits(event)">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="editFirstName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="editLastName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="editPhone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="editCompany" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Deal Value ($)</label>
                    <input type="number" id="editDealValue" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus" class="form-control">
                        <option value="lead">Lead</option>
                        <option value="contacted">Contacted</option>
                        <option value="won">Won</option>
                        <option value="lost">Lost</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Custom Alert Modal (alert()-ის ნაცვლად) -->
    <div class="modal" id="appAlertModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title" id="alertModalTitle">Notification</h3>
                <button type="button" class="modal-close-btn" onclick="closeAlertModal()">✖</button>
            </div>
            <p class="modal-message" id="alertModalMessage"></p>
            <div class="modal-actions">
                <button type="button" class="btn-primary btn-auto-width" onclick="closeAlertModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal (confirm()-ის ნაცვლად) -->
    <div class="modal" id="appConfirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title">Confirmation</h3>
                <button type="button" class="modal-close-btn" onclick="closeConfirmModal(false)">✖</button>
            </div>
            <p class="modal-message" id="confirmModalMessage">Are you sure?</p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeConfirmModal(false)">Cancel</button>
                <button type="button" class="btn-danger" onclick="closeConfirmModal(true)">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/clients.js"></script>
</body>

</html>
